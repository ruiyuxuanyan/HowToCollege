name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - "01-*/**"
      - "02-*/**"
      - "03-*/**"
      - "04-*/**"
      - "05-*/**"
      - "06-*/**"
      - "07-*/**"
      - "08-*/**"
      - "09-*/**"
      - "10-*/**"
      - "11-*/**"
      - "12-*/**"
      - "tools/**"
      - "promo/**"
      - "site/index.html"
      - "site/sitemap.xml"
      - "site/robots.txt"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 核查日期检查要读每个文件的最后一次提交日期，浅克隆拿不到历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"

      - name: Generate site data
        run: node tools/build-site.mjs

      - name: Generate social cards
        run: node tools/build-social.mjs

      - name: Generate per-article pages
        run: node tools/build-pages.mjs

      - name: Check article structure
        run: node tools/check-structure.js

      - name: Check verification dates
        run: node tools/check-dates.js

      - name: Check article pages
        run: node tools/check-pages.mjs

      - name: Check promo drafts
        run: node tools/check-promo.mjs

      - name: Check external links
        continue-on-error: true
        run: node tools/check-links.js

      - name: Verify output
        run: |
          test -f site/index.html
          test -f site/index.json
          test -f site/cover.png
          test -f site/sitemap.xml
          test -f site/robots.txt
          test -f site/og.png
          test -d site/a
          echo "分类包数量：$(ls site/body | wc -l)"
          node -e "
            const fs = require('fs');
            const d = require('./site/index.json');
            // 不写死篇数：与仓库内实际 Markdown 数量比对，防止构建漏读或重复
            const dirs = fs.readdirSync('.').filter(x => /^\d\d-/.test(x) && fs.statSync(x).isDirectory());
            let actual = 0;
            for (const dir of dirs) {
              actual += fs.readdirSync(dir).filter(f => f.endsWith('.md') && f !== 'README.md').length;
            }
            const problems = [];
            if (d.total !== actual) problems.push('索引篇数 ' + d.total + ' 与实际 Markdown 数 ' + actual + ' 不一致');
            if (d.categories.length !== dirs.length) problems.push('分类数不一致');
            const noSummary = d.articles.filter(a => !a.summary).length;
            if (noSummary) problems.push(noSummary + ' 篇缺一句话概括');
            if (problems.length) { console.error('构建校验失败：\n  ' + problems.join('\n  ')); process.exit(1); }
            console.log('OK · ' + d.total + ' 篇 · ' + d.categories.length + ' 个分类');
          "

      - name: Verify homepage count
        run: |
          node -e "
            const fs = require('fs');
            const d = require('./site/index.json');
            const h = fs.readFileSync('site/index.html', 'utf8');
            const title = (h.match(/<title>[^<]*· (\\d+) 篇<\\/title>/) || [])[1];
            const tag = (h.match(/class=\"tag\"[^>]*>(\\d+) 篇 · 遇到事查一条/) || [])[1];
            let bad = 0;
            if (String(d.total) !== title) { console.error('首页 title 写 ' + title + '，实际 ' + d.total); bad = 1; }
            if (String(d.total) !== tag) { console.error('首页角标写 ' + tag + '，实际 ' + d.total); bad = 1; }
            if (bad) process.exit(1);
            console.log('首页篇数一致：' + d.total);
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
